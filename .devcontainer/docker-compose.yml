services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: stephanie-dev-app   # ✅ add this line
    volumes:
      - ..:/workspace:cached
    depends_on:
      - db
    environment:
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in the untracked .env}"
    command: sleep infinity

  db:
    image: ankane/pgvector:latest   # Postgres with pgvector
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the untracked .env}"
      POSTGRES_DB: stephanie
    ports:
      - "5432:5432"

networks:
  default:
    name: devcontainer_default