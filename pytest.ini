[pytest]
# Native pytest configuration.
#
# NOTE: Do NOT force `-p aitest.pytest_plugin` here. The previous ini did:
#     addopts = -p aitest.pytest_plugin
# which routed every plain `pytest` run through the aitest supervision
# harness (15s foreground budget, 30s hard deadline, background delegation).
# Collection alone takes ~12-18s in this repo, so normal runs were
# backgrounded/killed and looked "broken".
#
# Use aitest explicitly when you want it:
#     aitest run
#     pytest --aitest-mode=on ...
# and bypass it explicitly with:
#     pytest --aitest-mode=off ...
# (requires `-p aitest.pytest_plugin` on the command line if you want the
# flag without the ini forcing the plugin).

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
