[build-system]
requires = ["setuptools>=69", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "stephanie"
version = "0.1.1"
description = "Stephanie — self-improving AI research & reasoning engine"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Ernan Hughes", email = "ernanhughes@gmail.com" }]
license = { file = "LICENSE" }

dependencies = [
    # Core config & engine
    "omegaconf>=2.3,<2.4",
    "hydra-core>=1.3.8",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.4",
    "numpy>=2.5.5",
    "dspy>=3.5",
    "litellm>=1.111,<2",
    "tabulate>=0.10",
    "python-dotenv>=1.2.4",
    "dependency-injector>=4.49.1",

    # Database / storage
    "psycopg2-binary>=2.9.13",
    "pgvector>=0.5.1",

    # Web search / scraping
    "requests>=2.34.2",
    "wikipedia>=1.4",
    "duckduckgo-search>=8.1.1",
    "readability-lxml>=0.9",
    "beautifulsoup4>=4.15",
    "arxiv>=4.1",
    "gradio_client>=2.7.2",
    "seaborn>=0.13.2",

    # Models / embeddings
    "torch>=2.2",
    "sentence-transformers>=3",
    "ollama>=0.6.3",
    "unstructured>=0.27.38",
    "huggingface_hub>=1.33,<2.0",  # capped: transformers/sentence-transformers pin <2.0
    "hf_transfer>=0.1.9",

    # Fuzzy matching
    "python-Levenshtein>=0.27.5",
    "fuzzywuzzy>=0.18",    # keep for compatibility
    "rapidfuzz>=3.14.6",   # preferred replacement

    # Parsing / text
    "lxml>=6.1.3",

    # Analysis
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "pdfminer.six>=20260107",

    # Paper pipeline (information.yaml)
    "pymupdf>=2.1",
    "pyvis>=0.3.2"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/ernanhughes/stephanie"
Repository = "https://github.com/ernanhughes/stephanie"
Issues = "https://github.com/ernanhughes/stephanie/issues"

[project.scripts]
stephanie = "stephanie.main:main"
sis = "sis.__main__:main"
sis-dashboard = "sis.dashboard:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = [
  "config/**/*.yaml",
  "prompts/**/*.txt",
  "docs/**/*.md",
]

[tool.setuptools.exclude-package-data]
"*" = [
  "models/**",
  "outputs/**",
  "logs/**",
  "data/**",
  "dist/**",
]
