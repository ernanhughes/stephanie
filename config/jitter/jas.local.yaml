# Local dev config for JAS
bus:
  enabled: true
  backend: zmq
  endpoint: '${oc.env:STEPH_BROKER_FE,tcp://127.0.0.1:5555}'
  backend_endpoint: '${oc.env:STEPH_BROKER_BE,tcp://127.0.0.1:5556}'
  required: false
  connect_timeout_s: 2.0
  fallback: none

jitter:
  tick_interval: 0.25      # seconds

homeostasis:
  energy_setpoint: 1.0
  boundary_setpoint: 0.8
  diversity_setpoint: 0.7
