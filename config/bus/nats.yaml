enabled: true
backend: nats            # "nats" | "inproc"
servers: '${oc.env:STEPHANIE_NATS_SERVERS,nats://127.0.0.1:4222}'
stream: stephanie
required: true         # if true (or strict true), fail instead of fallback
strict: true            # legacy alias for required
connect_timeout_s: 10   # fail fast if NATS isn’t up
fallback: none           # "inproc" | "none"
